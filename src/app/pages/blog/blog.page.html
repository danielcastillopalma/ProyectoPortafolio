<ion-content class="fondo">
    <div class="contenedor-card">
        <h1 class="titulo-home">Sugerencias, reclamos y felicitaciones.</h1>
    </div>
    <div class="ion-text-center">
  <ion-button color="success" id="open-modal">
    Publicar
  </ion-button>
</div>

    <ion-card>
        <ion-card-header>
            <ion-card-title>Reportes y sugerencias.</ion-card-title>
            <ion-card-subtitle>Acá aparecerán tus Sugerencias, reclamos y felicitaciones. Todos los casos serán
                revisados, gracias por ayudarnos a mejorar.</ion-card-subtitle>
        </ion-card-header>
        <ion-card-content>
            <ion-list>
                <ion-item>
                    <ion-thumbnail slot="start">
                        <img alt="Silhouette of mountains"
                            src="https://ionicframework.com/docs/img/demos/thumbnail.svg" />
                    </ion-thumbnail>
                    <ion-label>NO IMPLEMENTADO</ion-label>
                </ion-item>

                
            </ion-list>
        </ion-card-content>
    </ion-card>

    <ion-modal trigger="open-modal" (willDismiss)="onWillDismiss($event)">
        <ng-template>
            <ion-header>
                <ion-toolbar>
                    <ion-buttons slot="start">
                        <ion-button (click)="cancel()"><ion-icon name="arrow-back-outline"></ion-icon></ion-button>
                    </ion-buttons>
                    <ion-title>Punto Verde</ion-title>
                    <ion-buttons slot="end">
                        <ion-button (click)="confirm()" [strong]="true"><ion-icon
                                name="checkmark-outline"></ion-icon></ion-button>
                    </ion-buttons>
                </ion-toolbar>
            </ion-header>
            <ion-content class="ion-padding">
                <ion-list>
                    <ion-item>
                        <ion-select aria-label="Tipo consulta" interface="popover" placeholder="Seleccione."
                            (ionChange)="handleChange($event)">
                            <ion-select-option value="Reporte">Reporte</ion-select-option>
                            <ion-select-option value="Sugerencia">Sugerencia</ion-select-option>
                        </ion-select>
                    </ion-item>
                    <ion-item>
                        <ion-textarea [label]="'Ingrese su ' + seleccionado" labelPlacement="floating" [counter]="true"
                            maxlength="250" [counterFormatter]="customCounterFormatter"></ion-textarea>
                    </ion-item>
                    <ion-item>
                        <ion-button (click)="getPhoto()"><ion-icon name="images-outline"></ion-icon></ion-button>
                    </ion-item>
                </ion-list>
            </ion-content>
        </ng-template>
    </ion-modal>

    

</ion-content>
